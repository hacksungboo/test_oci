{{- if and (eq .Values.workload.kind "Deployment") .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telos-service.fullname" . }}
  labels:
    {{- include "telos-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "telos-service.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
{{- end }}
