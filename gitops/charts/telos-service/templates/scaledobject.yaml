# gitops/charts/telos-service/templates/scaledobject.yaml
{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "telos-service.fullname" . }}
  labels:
    {{- include "telos-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "telos-service.fullname" . }}

  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}

  {{- with .Values.keda.advanced }}
  advanced:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  triggers:
    {{- range .Values.keda.triggers }}
    - type: prometheus
      metadata:
        serverAddress: {{ .serverAddress }}
        query: {{ .query | quote }}
        threshold: {{ .threshold | quote }}
        {{- if .activationThreshold }}
        activationThreshold: {{ .activationThreshold | quote }}
        {{- end }}
    {{- end }}
{{- end }}