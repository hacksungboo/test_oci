# applicationset-platform.yaml 의 git file generator 가 이 파일을 찾아 Application(name=envoy-gateway)을 만든다.
name: envoy-gateway
namespace: infra

helm:
  repoURL: docker.io/envoyproxy   # OCI Helm 레지스트리. 02-bootstrap 이 enableOCI repository Secret 을 등록함
  chart: gateway-helm
  version: "v1.9.1"               # MoongCheap 에서 검증한 버전. Gateway API CRD 동봉, K8s 1.30+ 필요(OKE 최신 버전 충족)
