# 데이터플레인(Envoy) Deployment/Service 설정.
# Service 이름을 telos-envoy 로 고정해서 cloudflared ConfigMap 에서 안정적으로 참조한다.
# type: ClusterIP -> OCI Load Balancer 를 만들지 않는다 (외부 진입은 cloudflared 터널만).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: telos-envoy
  namespace: infra
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
        name: telos-envoy
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
