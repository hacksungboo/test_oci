apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: telos-gateway
  namespace: infra
spec:
  gatewayClassName: telos
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All   # telos-dev / telos-prod / argocd 의 HTTPRoute 가 이 Gateway 에 붙을 수 있게 허용
