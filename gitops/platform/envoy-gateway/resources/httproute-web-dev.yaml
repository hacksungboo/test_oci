# ccmall.shop -> telos-dev/web (nginx 테스트 페이지)
# backendRefs.name 은 telos-service chart 의 fullname (releaseName=web, nameOverride=web -> "web")
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: telos-dev
spec:
  hostnames:
    - "ccmall.shop"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: telos-gateway
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: web
          port: 80
          weight: 1
