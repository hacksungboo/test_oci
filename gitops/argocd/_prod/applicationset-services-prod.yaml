# prod 서비스 ApplicationSet (아직 미적용). 적용하려면 이 파일을 gitops/argocd/ 로 옮긴다.
#   base -> env/dev -> services/<service> -> overrides/prod/<service>
# 서비스 추가 = elements 에 한 줄 + values/services/<service>.yaml + values/overrides/prod/<service>.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: telos-services-prod
  namespace: argocd

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          - service: web
          # 주제 확정 후 추가
          # - service: api
          # - service: ai

  template:
    metadata:
      name: "{{ .service }}-prod"

    spec:
      project: telos-services

      sources:
        - repoURL: https://github.com/hacksungboo/test_oci.git
          targetRevision: main
          path: gitops/charts/telos-service
          helm:
            releaseName: "{{ .service }}"
            valueFiles:
              - $values/gitops/values/base.yaml
              - $values/gitops/values/env/prod.yaml
              - $values/gitops/values/services/{{ .service }}.yaml
              - $values/gitops/values/overrides/prod/{{ .service }}.yaml

        - repoURL: https://github.com/hacksungboo/test_oci.git
          targetRevision: main
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: telos-prod

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
